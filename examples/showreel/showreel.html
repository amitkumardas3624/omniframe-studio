<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>
'use strict';
(function () {

/* ======================================================================
   OMNIFRAME STUDIO — 15s motion showreel
   ----------------------------------------------------------------------
   Everything on screen is a pure function of time.  window.seek(t) takes
   seconds from 0 to 15 and redraws the whole frame from scratch.  There is
   no CSS animation, no timer and no state carried between frames: the same
   t always produces the same pixels.

   Timeline (120 BPM, one beat = 0.5s, 30 beats):
     0.0 -  3.0  hook + kinetic type      (beats 1-6)
     3.0 -  6.0  shape morphing           (beats 7-12)
     6.0 -  9.0  2D to 3D                 (beats 13-18)
     9.0 - 12.0  data / UI                (beats 19-24)
    12.0 - 15.0  end title + loop         (beats 25-30)
   ====================================================================== */

const W = 1920, H = 1080;
const BG   = '#0C0C0D';
const INK  = '#F5F2EA';
const RED  = '#FF4B26';
const BLUE = '#2F4BFF';
const SAND = '#C9C2B4';

const DUR  = 15.0;
const BEAT = 0.5;
const FONT = '"Archivo Black"';

const cv  = document.getElementById('stage');
const ctx = cv.getContext('2d', { alpha: false });
ctx.textBaseline = 'alphabetic';
ctx.textAlign = 'left';

/* ---------------------------------------------------------------- math */
const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
const clamp01 = (v) => clamp(v, 0, 1);
const lerp = (a, b, u) => a + (b - a) * u;
const easeOutExpo = (u) => { u = clamp01(u); return u <= 0 ? 0 : 1 - Math.pow(2, -10 * u); };
const easeInOutExpo = (u) => {
  u = clamp01(u);
  if (u <= 0) return 0;
  if (u >= 1) return 1;
  return u < 0.5 ? Math.pow(2, 20 * u - 10) / 2 : (2 - Math.pow(2, -20 * u + 10)) / 2;
};
const easeOutCubic = (u) => { u = clamp01(u); return 1 - Math.pow(1 - u, 3); };

/* Closed-form spring step response: no integrator, no carried state. */
function spring(u, omega, zeta) {
  u = Math.max(0, u);
  if (u === 0) return 0;
  const wd = omega * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * omega * u) * (Math.cos(wd * u) + (zeta * omega / wd) * Math.sin(wd * u));
}
/* deterministic noise — never Math.random */
const hash = (n) => {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
  return x - Math.floor(x);
};
const seg = (t, a, b) => clamp01((t - a) / ((b - a) || 1e-9));

/* ------------------------------------------------------------- typography */
const GLYPHS = {
  O: ['.###.', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'],
  M: ['#...#', '##.##', '#.#.#', '#...#', '#...#', '#...#', '#...#'],
  N: ['#...#', '##..#', '#.#.#', '#..##', '#...#', '#...#', '#...#'],
  I: ['#####', '..#..', '..#..', '..#..', '..#..', '..#..', '#####']
};
const LETTERS = ['O', 'M', 'N', 'I'];
const TYPE_CELL = 76, TYPE_GAP = 1, TYPE_ROWS = 7, TYPE_COLS = 5;
const GRID_COLS = 13, GRID_ROWS = 5, GRID_PITCH = 140, CELL_HALF = 63;
const SEED_X = 960, SEED_Y = 540, SEED_R = 8, RING_R = 200;

/* ------------------------------------------------------------------ cells
   65 cells: 16 (O) + 17 (M) + 17 (N) + 15 (I) = 13 x 5 = 65, so the very
   same cells carry the wordmark, the grid, the city, the UI and the frame. */
const CELLS = (function buildCells() {
  const cells = [];
  const totalCols = LETTERS.length * TYPE_COLS + (LETTERS.length - 1) * TYPE_GAP;
  const x0 = (W - totalCols * TYPE_CELL) / 2;
  const y0 = (H - TYPE_ROWS * TYPE_CELL) / 2;
  LETTERS.forEach(function (ch, li) {
    const g = GLYPHS[ch];
    for (let r = 0; r < TYPE_ROWS; r++) {
      for (let c = 0; c < TYPE_COLS; c++) {
        if (g[r][c] !== '#') continue;
        const col = li * (TYPE_COLS + TYPE_GAP) + c;
        cells.push({
          index: cells.length,
          letter: ch,
          tx: x0 + col * TYPE_CELL,
          ty: y0 + r * TYPE_CELL,
          gx: 0, gy: 0,
          ring: { x: 0, y: 0 },
          ui: null,
          frame: null
        });
      }
    }
  });
  const gx0 = (W - GRID_COLS * GRID_PITCH) / 2;
  const gy0 = (H - GRID_ROWS * GRID_PITCH) / 2;
  cells.forEach(function (cell, i) {
    cell.gx = gx0 + (i % GRID_COLS) * GRID_PITCH + GRID_PITCH / 2;
    cell.gy = gy0 + Math.floor(i / GRID_COLS) * GRID_PITCH + GRID_PITCH / 2;
  });
  /* the O cells start as a ring at the centre of the screen */
  let oi = 0;
  const oCount = 16;
  cells.forEach(function (cell) {
    if (cell.letter !== 'O') return;
    const a = -Math.PI / 2 + (oi / oCount) * Math.PI * 2;
    cell.ring.x = SEED_X + Math.cos(a) * RING_R;
    cell.ring.y = SEED_Y + Math.sin(a) * RING_R;
    oi++;
  });
  return cells;
})();

/* UI slots: 13 thumbs + 13 timeline + 13 bars + 26 panel = 65 */
(function assignUI() {
  let i = 0;
  const take = function (n, fn) { for (let k = 0; k < n; k++, i++) fn(CELLS[i], k); };
  take(13, function (c, k) { c.ui = { x: 130 + k * 84 + 37, y: 330 + 37, w: 74, h: 74, kind: 'thumb' }; });
  take(13, function (c, k) { c.ui = { x: 130 + k * 84 + 37, y: 440 + 37, w: 74, h: 74, kind: 'strip' }; });
  take(13, function (c, k) {
    const h = 46 + 168 * hash(k * 3.77 + 1.3);
    c.ui = { x: 130 + k * 66 + 26, y: 780 - h / 2, w: 52, h: h, kind: 'bar' };
  });
  take(26, function (c, k) {
    const col = k % 13, row = Math.floor(k / 13);
    c.ui = { x: 1226 + col * 52 + 26, y: 330 + row * 70 + 26, w: 52, h: 52, kind: 'panel' };
  });
})();

/* the title frame: the 32 perimeter cells of the 13 x 5 grid */
(function assignFrame() {
  const top = [], bottom = [], left = [], right = [];
  for (let c = 0; c < GRID_COLS; c++) { top.push(c); bottom.push(GRID_COLS * (GRID_ROWS - 1) + c); }
  for (let r = 1; r < GRID_ROWS - 1; r++) { left.push(r * GRID_COLS); right.push(r * GRID_COLS + GRID_COLS - 1); }
  const set = top.concat(bottom, left, right);
  const fx0 = 160, fx1 = 1760, fy0 = 262, fy1 = 818;
  set.forEach(function (idx, k) {
    const c = CELLS[idx];
    let x, y;
    if (k < 13) { x = fx0 + (fx1 - fx0) * (k / 12); y = fy0; }
    else if (k < 26) { x = fx0 + (fx1 - fx0) * ((k - 13) / 12); y = fy1; }
    else if (k < 29) { x = fx0; y = fy0 + (fy1 - fy0) * ((k - 26 + 1) / 4); }
    else { x = fx1; y = fy0 + (fy1 - fy0) * ((k - 29 + 1) / 4); }
    c.frame = { x: x, y: y };
  });
})();

/* ------------------------------------------------------------ phase poses */
const ARRIVE = { O: 0.95, M: 1.30, N: 1.65, I: 2.00 };

function poseType(cell, t) {
  const u = t - ARRIVE[cell.letter];
  const sp = spring(u, 15, 0.62);
  let x = cell.tx, y = cell.ty;
  if (cell.letter === 'O') {
    const k = easeOutCubic(clamp01(u / 0.40));
    x = lerp(cell.ring.x, cell.tx, k);
    y = lerp(cell.ring.y, cell.ty, k);
  } else {
    const k = easeOutCubic(clamp01(u / 0.34));
    x = cell.tx + (1 - k) * 210;
    y = cell.ty + (1 - k) * 38;
  }
  return { x: x, y: y, s: TYPE_CELL * clamp(sp, 0, 1.2), kind: 'type' };
}

function gridPulse(cell, t) {
  const wave = Math.sin((t - 3.0) * 4.2 - (cell.index % GRID_COLS) * 0.42);
  return wave > 0.93 ? (wave - 0.93) / 0.07 : 0;
}

/* 3D: the flat grid becomes a floor and the cells stand up on it.
   At elevation 0 the projection is exactly the flat grid, so the 2D to 3D
   moment is one continuous move rather than a cut. */
const FOV = 2900;
function projectFloor(X, Z, hh, elev, yaw, camZ) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const Xr = X * cy + Z * sy;
  const Zr = -X * sy + Z * cy;
  const ce = Math.cos(elev), se = Math.sin(elev);
  const offY = Zr * ce - hh * se;
  const depth = camZ - (Zr * se + hh * ce);
  const s = FOV / depth;
  return { x: 960 + Xr * s, y: 540 + offY * s, s: s, depth: depth };
}

function cubeParams(t) {
  const elev = lerp(0, 0.80, easeInOutExpo(seg(t, 5.2, 6.6))) * (1 - easeInOutExpo(seg(t, 8.4, 9.0)));
  const yaw = lerp(0, -0.18, easeInOutExpo(seg(t, 5.2, 6.4)))
            + lerp(0, 0.58, easeInOutExpo(seg(t, 6.4, 8.4)))
            - lerp(0, 0.58, easeInOutExpo(seg(t, 8.4, 9.0)));
  /* the camera pulls back as the floor tilts, so the city stays in frame */
  const camZ = 2900 + 700 * (elev / 0.80) - 250 * easeInOutExpo(seg(t, 6.0, 8.4));
  return { elev: elev, yaw: yaw, camZ: camZ };
}

function poseCube(cell, t) {
  const pr = cubeParams(t);
  const col = cell.index % GRID_COLS;
  const row = Math.floor(cell.index / GRID_COLS);
  const wave = Math.sin((t - 5.2) * 4.2 - col * 0.42 - row * 0.10);
  const grow = easeInOutExpo(seg(t, 5.2, 6.4));
  const h = (70 + 150 * (0.5 + 0.5 * wave)) * grow;
  const X = cell.gx - 960;
  const Z = cell.gy - 540;
  const hs = CELL_HALF;
  const b = [
    projectFloor(X - hs, Z - hs, 0, pr.elev, pr.yaw, pr.camZ),
    projectFloor(X + hs, Z - hs, 0, pr.elev, pr.yaw, pr.camZ),
    projectFloor(X + hs, Z + hs, 0, pr.elev, pr.yaw, pr.camZ),
    projectFloor(X - hs, Z + hs, 0, pr.elev, pr.yaw, pr.camZ)
  ];
  const tp = [
    projectFloor(X - hs, Z - hs, h, pr.elev, pr.yaw, pr.camZ),
    projectFloor(X + hs, Z - hs, h, pr.elev, pr.yaw, pr.camZ),
    projectFloor(X + hs, Z + hs, h, pr.elev, pr.yaw, pr.camZ),
    projectFloor(X - hs, Z + hs, h, pr.elev, pr.yaw, pr.camZ)
  ];
  const depth = (b[0].depth + b[2].depth) / 2;
  return { bottom: b, top: tp, h: h, depth: depth, yaw: pr.yaw };
}

function cubeAnchor(cell, t) {
  const c = poseCube(cell, t);
  let x = 0, y = 0;
  for (let i = 0; i < 4; i++) { x += c.bottom[i].x; y += c.bottom[i].y; }
  return { x: x / 4, y: y / 4 };
}

function poseUI(cell, t) {
  const u = cell.ui;
  const arrive = 9.05 + (cell.index % 13) * 0.022;
  const sp = clamp(spring(t - arrive, 13, 0.66), 0, 1.2);
  const k = clamp01(sp);
  return {
    x: u.x, y: u.y, w: u.w * (0.35 + 0.65 * k), h: u.h * (0.35 + 0.65 * k),
    kind: u.kind, index: cell.index
  };
}

/* ------------------------------------------------------------- drawing */
function strokeRect(x, y, w, h, color, width, alpha) {
  if (w <= 0 || h <= 0 || alpha <= 0.004) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.stroke();
  ctx.restore();
}

function fillRect(x, y, w, h, color, alpha) {
  if (w <= 0 || h <= 0 || alpha <= 0.004) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.fill();
  ctx.restore();
}

function poly(points, color, alpha, stroke, lineWidth) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.closePath();
  ctx.fill();
  if (stroke) {
    ctx.globalAlpha = alpha * 0.5;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }
  ctx.restore();
}

/* letterspaced text, drawn glyph by glyph so the result is identical
   everywhere and does not depend on ctx.letterSpacing support */
function tracked(text, x, y, size, color, spacing, alpha) {
  if (alpha <= 0.004) return 0;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.font = '400 ' + size + 'px ' + FONT;
  let cx = x;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + spacing;
  }
  ctx.restore();
  return cx - x - spacing;
}

function trackedWidth(text, size, spacing) {
  ctx.save();
  ctx.font = '400 ' + size + 'px ' + FONT;
  let w = 0;
  for (let i = 0; i < text.length; i++) w += ctx.measureText(text[i]).width + spacing;
  ctx.restore();
  return w - spacing;
}

/* the big wordmark, drawn twice: once in ink, once clipped in accent */
function drawWord(text, size, baseY, color, tracking, alpha) {
  if (alpha <= 0.004) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.font = '400 ' + size + 'px ' + FONT;
  const widths = [];
  let total = 0;
  for (let i = 0; i < text.length; i++) {
    const w = ctx.measureText(text[i]).width;
    widths.push(w);
    total += w + tracking;
  }
  total -= tracking;
  let x = 960 - total / 2;
  for (let i = 0; i < text.length; i++) {
    ctx.fillText(text[i], x, baseY);
    x += widths[i] + tracking;
  }
  ctx.restore();
}

/* -------------------------------------------------------------- the ink */
function drawSeed(t) {
  let a = 0, r = SEED_R;
  if (t < 0.30) {
    a = 1;
    r = SEED_R;
  } else if (t > 14.62) {
    const u = clamp01((t - 14.62) / 0.28);
    a = easeOutExpo(u);
    r = SEED_R;
  } else {
    return;
  }
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.arc(SEED_X, SEED_Y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

/* the spiral: the seed draws one full turn that opens into the ring */
function drawSpiral(t) {
  const u = seg(t, 0.26, 1.05);
  if (u <= 0) return;
  const alpha = 1 - clamp01((t - 0.90) / 0.22);
  if (alpha <= 0.004) return;
  const a0 = -Math.PI / 2;
  const sweep = Math.PI * 2 * easeInOutExpo(u);
  const steps = 90;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = INK;
  ctx.lineWidth = 13;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const k = (i / steps) * u;
    const ang = a0 + Math.PI * 2 * easeInOutExpo(k);
    const rad = RING_R * k;
    const x = SEED_X + Math.cos(ang) * rad;
    const y = SEED_Y + Math.sin(ang) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.restore();
}

/* ------------------------------------------------------------ cell paint */
function paintType(p) {
  const h = p.s / 2;
  fillRect(p.x - h, p.y - h, p.s, p.s, INK, 1);
}

function paintGrid(p, pulse) {
  const h = CELL_HALF;
  if (pulse > 0.02) {
    fillRect(p.x - h, p.y - h, h * 2, h * 2, BLUE, 1);
  } else {
    strokeRect(p.x - h, p.y - h, h * 2, h * 2, INK, 2, 0.5);
  }
}

function paintCube(c) {
  const b = c.bottom, tp = c.top;
  /* the wall face toward the camera */
  poly([b[3], b[2], tp[2], tp[3]], BLUE, 0.58, null, 0);
  /* one vertical side face, chosen by the yaw direction */
  if (c.yaw >= 0) poly([b[1], b[2], tp[2], tp[1]], BLUE, 0.30, null, 0);
  else poly([b[0], b[3], tp[3], tp[0]], BLUE, 0.30, null, 0);
  /* the roof */
  poly(tp, BLUE, 1, INK, 1.6);
}

function paintUI(p, sub, alpha) {
  const w = p.w, h = p.h;
  if (sub === 'bar') {
    fillRect(p.x - w / 2, p.y - h / 2, w, h, BLUE, alpha);
  } else if (sub === 'thumb') {
    strokeRect(p.x - w / 2, p.y - h / 2, w, h, INK, 2, alpha * 0.55);
    fillRect(p.x - w / 2 + 13, p.y - h / 2 + 13, w - 26, h - 26, INK, alpha * 0.10);
  } else if (sub === 'panel') {
    strokeRect(p.x - w / 2, p.y - h / 2, w, h, SAND, 1.5, alpha * 0.3);
  } else {
    strokeRect(p.x - w / 2, p.y - h / 2, w, h, INK, 2, alpha * 0.34);
  }
}

/* ------------------------------------------------- per-cell resolution */
function cellState(cell, t) {
  if (t < 3.0) return poseType(cell, t);

  if (t < 5.2) {
    const stagger = (cell.index % GRID_COLS) * 0.030 + Math.floor(cell.index / GRID_COLS) * 0.012;
    const u = clamp01(spring(t - (3.0 + stagger), 13, 0.66));
    const a = poseType(cell, 3.0);
    /* one slow camera push through the whole grid section */
    const g = 1 + 0.055 * easeInOutExpo(seg(t, 3.6, 5.2));
    const x = lerp(a.x, cell.gx, u);
    const y = lerp(a.y, cell.gy, u);
    return {
      x: 960 + (x - 960) * g, y: 540 + (y - 540) * g,
      s: lerp(a.s, CELL_HALF * 2, u) * g, kind: 'grid'
    };
  }

  if (t < 9.0) return { kind: 'cube', cube: poseCube(cell, t) };

  if (t < 11.2) {
    const arrive = 9.05 + (cell.index % 13) * 0.022;
    const u = clamp01(spring(t - arrive, 13, 0.66));
    const anchor = cubeAnchor(cell, 9.0);
    const b = poseUI(cell, t);
    return {
      x: lerp(anchor.x, b.x, u), y: lerp(anchor.y, b.y, u),
      w: lerp(CELL_HALF * 2, b.w, u), h: lerp(CELL_HALF * 2, b.h, u),
      kind: 'ui', index: cell.index, sub: b.kind
    };
  }

  if (t < 13.0) {
    const u = clamp01(spring(t - 11.35, 11, 0.72));
    const b = poseUI(cell, 11.2);
    const fx = cell.frame ? cell.frame.x : SEED_X;
    const fy = cell.frame ? cell.frame.y : SEED_Y;
    const fs = cell.frame ? 46 : 0;
    return {
      x: lerp(b.x, fx, u), y: lerp(b.y, fy, u),
      w: lerp(b.w, fs, u), h: lerp(b.h, fs, u),
      kind: 'ui', index: cell.index, sub: cell.frame ? 'frame' : 'fade'
    };
  }

  /* the frame opens outward, then everything collapses back to the seed */
  const open = easeOutExpo(seg(t, 13.55, 14.30)) * 46;
  const collapse = clamp01(spring(t - 14.55, 12, 0.85));
  const base = cell.frame || { x: SEED_X, y: SEED_Y };
  const dx = base.x - SEED_X, dy = base.y - SEED_Y;
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  const x = lerp(base.x + (dx / len) * open, SEED_X, collapse);
  const y = lerp(base.y + (dy / len) * open, SEED_Y, collapse);
  const size = (cell.frame ? 46 : 0) * (1 - collapse);
  return { x: x, y: y, w: size, h: size, kind: 'ui', index: cell.index, sub: cell.frame ? 'frame' : 'fade' };
}

/* ------------------------------------------------------------- the scene */
function drawScene(t) {
  ctx.save();
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  drawSeed(t);
  drawSpiral(t);

  if (t < 3.0) {
    for (let i = 0; i < CELLS.length; i++) {
      const p = cellState(CELLS[i], t);
      paintType(p);
    }
  } else if (t < 5.2) {
    for (let i = 0; i < CELLS.length; i++) {
      const cell = CELLS[i];
      const p = cellState(cell, t);
      paintGrid(p, gridPulse(cell, t));
    }
  } else if (t < 9.0) {
    const order = [];
    for (let i = 0; i < CELLS.length; i++) {
      const cell = CELLS[i];
      order.push({ cell: cell, cube: poseCube(cell, t) });
    }
    order.sort(function (a, b) { return b.cube.depth - a.cube.depth; });
    for (let i = 0; i < order.length; i++) paintCube(order[i].cube);
  } else if (t < 13.0) {
    for (let i = 0; i < CELLS.length; i++) {
      const p = cellState(CELLS[i], t);
      if (p.sub === 'fade') continue;
      if (p.sub === 'bar') fillRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h, BLUE, 1);
      else if (p.sub === 'frame') strokeRect(p.x - p.w / 2, p.y - p.w / 2, p.w, p.w, INK, 2, 0.6);
      else paintUI(p, p.sub, 1);
    }
  } else {
    for (let i = 0; i < CELLS.length; i++) {
      const p = cellState(CELLS[i], t);
      if (p.sub !== 'frame' || p.w <= 0.5) continue;
      strokeRect(p.x - p.w / 2, p.y - p.w / 2, p.w, p.w, INK, 2, 0.6);
    }
  }

  /* --- UI chrome ---------------------------------------------------- */
  if (t >= 9.2 && t < 11.9) {
    const fade = 1 - clamp01((t - 11.2) / 0.6);
    if (fade > 0.01) {
      tracked('AGENT / RENDER / COMPOSE', 130, 196, 24, SAND, 5, 0.8 * fade);
      const shown = Math.max(0, Math.min(15, t));
      const mm = Math.floor(shown / 60);
      const ss = Math.floor(shown % 60);
      const ms = Math.floor((shown % 1) * 1000);
      const code = String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0') + '.' + String(ms).padStart(3, '0');
      const cw = trackedWidth(code, 38, 2);
      const clip = Math.floor(clamp01((t - 9.4) / 0.35) * code.length);
      ctx.save();
      ctx.globalAlpha = 0.95 * fade;
      ctx.fillStyle = INK;
      ctx.font = '400 38px ' + FONT;
      ctx.beginPath();
      ctx.rect(130, 120, Math.max(0, cw * (clip / code.length)), 170);
      ctx.clip();
      ctx.fillText(code, 130, 264);
      ctx.restore();
      const pu = easeInOutExpo(seg(t, 9.8, 10.6));
      const px = lerp(130, 1138, pu);
      fillRect(px - 1, 300, 2, 500, RED, 0.95 * fade);
      fillRect(px - 9, 300, 18, 9, RED, 0.95 * fade);
      tracked('LAYERS', 1226, 300, 22, SAND, 5, 0.75 * fade);
      tracked('SHOTS', 130, 306, 18, SAND, 5, 0.6 * fade);
      tracked('TIMELINE', 130, 416, 18, SAND, 5, 0.6 * fade);
      tracked('FRAME ' + String(Math.floor(t * 60)).padStart(4, '0') + ' / 0900', 130, 900, 22, SAND, 5, 0.75 * fade);
      fillRect(130, 940, 1660, 2, SAND, 0.2 * fade);
      fillRect(130, 940, 1660 * clamp01((t - 9.2) / 6.0), 2, RED, 0.9 * fade);
    }
  }

  /* --- title -------------------------------------------------------- */
  if (t >= 12.2) {
    const collapse = clamp01(spring(t - 14.55, 12, 0.85));
    const word = 'OMNIFRAME';
    const size = 176;
    const tracking = 2;
    const widths = [];
    let total = 0;
    ctx.save();
    ctx.font = '400 ' + size + 'px ' + FONT;
    for (let i = 0; i < word.length; i++) {
      const w = ctx.measureText(word[i]).width;
      widths.push(w);
      total += w + tracking;
    }
    total -= tracking;
    ctx.restore();
    const startX = 960 - total / 2;
    let offset = 0;
    for (let i = 0; i < word.length; i++) {
      const u = t - (12.25 + i * 0.075);
      if (u >= 0) {
        const sp = spring(u, 17, 0.58);
        const cx = startX + offset + widths[i] / 2;
        const scale = (1 + (1 - sp) * 0.16) * (1 - collapse);
        const dy = (1 - sp) * -46;
        const alpha = clamp01(u / 0.10) * (1 - collapse);
        if (alpha > 0.01 && scale > 0.004) {
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = INK;
          ctx.font = '400 ' + size + 'px ' + FONT;
          ctx.translate(lerp(cx, SEED_X, collapse), lerp(580 + dy, SEED_Y, collapse));
          ctx.scale(scale, scale);
          ctx.fillText(word[i], -widths[i] / 2, 0);
          ctx.restore();
        }
      }
      offset += widths[i] + tracking;
    }
    /* accent sweep across the wordmark */
    if (t > 13.30 && collapse < 0.02) {
      const u = easeInOutExpo(seg(t, 13.30, 13.95));
      const bx = lerp(140, 1780, u);
      ctx.save();
      ctx.beginPath();
      ctx.rect(bx - 96, 430, 192, 220);
      ctx.clip();
      drawWord(word, size, 580, RED, tracking, 1);
      ctx.restore();
    }
    /* studio line */
    const su = clamp01((t - 12.95) / 0.45);
    if (su > 0 && collapse < 0.99) {
      const w = trackedWidth('STUDIO', 54, 20);
      ctx.save();
      ctx.globalAlpha = 1 - collapse;
      ctx.beginPath();
      ctx.rect(960 - w / 2 - 40, 630, (w + 80) * su, 100);
      ctx.clip();
      tracked('STUDIO', 960 - w / 2, 686, 54, SAND, 20, 1 - collapse);
      ctx.restore();
    }
    /* rule under the title */
    const ru = clamp01((t - 13.05) / 0.4);
    if (ru > 0 && collapse < 0.99) {
      fillRect(960 - 110 * ru, 736, 220 * ru, 3, RED, 1 - collapse);
    }
    /* footer line */
    const fu = clamp01((t - 13.20) / 0.5);
    if (fu > 0 && collapse < 0.99) {
      const fw = trackedWidth('AGENTS TO FINAL VIDEO', 22, 8);
      ctx.save();
      ctx.globalAlpha = 1 - collapse;
      ctx.beginPath();
      ctx.rect(960 - fw / 2 - 20, 872, (fw + 40) * fu, 40);
      ctx.clip();
      tracked('AGENTS TO FINAL VIDEO', 960 - fw / 2, 890, 22, SAND, 8, 1 - collapse);
      ctx.restore();
    }
  }

  ctx.restore();
}

/* --------------------------------------------------------------- seek */
window.seek = function (t) {
  drawScene(clamp(t, 0, DUR));
};

/* ================================================================ audio
   The soundtrack is synthesised in the browser with the Web Audio API and
   rendered offline, so it is sample-exact and needs no audio assets. */
window.renderSoundtrack = function (sampleRate, duration) {
  sampleRate = sampleRate || 48000;
  duration = duration || DUR;
  const ac = new OfflineAudioContext(2, Math.ceil(sampleRate * duration), sampleRate);

  const master = ac.createGain();
  master.gain.value = 0.9;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14;
  comp.knee.value = 6;
  comp.ratio.value = 4;
  comp.attack.value = 0.004;
  comp.release.value = 0.18;
  master.connect(comp);
  comp.connect(ac.destination);

  const noiseBuffer = (function () {
    const len = Math.ceil(sampleRate * 2);
    const buf = ac.createBuffer(1, len, sampleRate);
    const data = buf.getChannelData(0);
    let seed = 12345;
    for (let i = 0; i < len; i++) {
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;
      data[i] = (seed / 0x3fffffff) - 1;
    }
    return buf;
  })();

  function kick(at, level) {
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(148, at);
    osc.frequency.exponentialRampToValueAtTime(46, at + 0.11);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(level, at + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.30);
    osc.connect(g); g.connect(master);
    osc.start(at); osc.stop(at + 0.34);
    const click = ac.createBufferSource();
    click.buffer = noiseBuffer;
    const cf = ac.createBiquadFilter();
    cf.type = 'highpass'; cf.frequency.value = 2600;
    const cg = ac.createGain();
    cg.gain.setValueAtTime(0.16 * level, at);
    cg.gain.exponentialRampToValueAtTime(0.0001, at + 0.035);
    click.connect(cf); cf.connect(cg); cg.connect(master);
    click.start(at); click.stop(at + 0.05);
  }

  function hat(at, level) {
    const src = ac.createBufferSource();
    src.buffer = noiseBuffer;
    src.playbackRate.value = 1.7;
    const f = ac.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 7200;
    const g = ac.createGain();
    g.gain.setValueAtTime(level, at);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.045);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(at); src.stop(at + 0.06);
  }

  function sceneHit(at, level) {
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(210, at);
    osc.frequency.exponentialRampToValueAtTime(58, at + 0.20);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(level, at + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.62);
    osc.connect(g); g.connect(master);
    osc.start(at); osc.stop(at + 0.66);
    const src = ac.createBufferSource();
    src.buffer = noiseBuffer;
    const f = ac.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(1800, at);
    f.frequency.exponentialRampToValueAtTime(240, at + 0.42);
    const ng = ac.createGain();
    ng.gain.setValueAtTime(level * 0.55, at);
    ng.gain.exponentialRampToValueAtTime(0.0001, at + 0.45);
    src.connect(f); f.connect(ng); ng.connect(master);
    src.start(at); src.stop(at + 0.5);
  }

  function bass(at, freq, len, level) {
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(level, at + 0.012);
    g.gain.setValueAtTime(level, at + len * 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    osc.connect(g); g.connect(master);
    osc.start(at); osc.stop(at + len + 0.05);
  }

  function riser(from, to) {
    const dur = to - from;
    const src = ac.createBufferSource();
    src.buffer = noiseBuffer;
    src.loop = true;
    const f = ac.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 3.2;
    f.frequency.setValueAtTime(340, from);
    f.frequency.exponentialRampToValueAtTime(6200, to);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, from);
    g.gain.exponentialRampToValueAtTime(0.30, to - 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, to);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(from); src.stop(to + 0.05);
    const saw = ac.createOscillator();
    const sg = ac.createGain();
    saw.type = 'sawtooth';
    saw.frequency.setValueAtTime(180, from);
    saw.frequency.exponentialRampToValueAtTime(940, to);
    sg.gain.setValueAtTime(0.0001, from);
    sg.gain.exponentialRampToValueAtTime(0.10, to - 0.02);
    sg.gain.exponentialRampToValueAtTime(0.0001, to);
    saw.connect(sg); sg.connect(master);
    saw.start(from); saw.stop(to + 0.05);
  }

  function reverseSwell(at, len) {
    const src = ac.createBufferSource();
    src.buffer = noiseBuffer;
    const f = ac.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 4200;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.22, at + len);
    g.gain.exponentialRampToValueAtTime(0.0001, at + len + 0.03);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(at); src.stop(at + len + 0.05);
  }

  /* the arrangement: a kick on every beat, a hit on every scene change */
  const beats = Math.floor(duration / BEAT);
  for (let b = 0; b < beats; b++) {
    const t = b * BEAT;
    kick(t, b % 4 === 0 ? 0.92 : 0.74);
    hat(t + BEAT / 2, b % 2 === 0 ? 0.055 : 0.085);
  }
  [0, 3, 6, 9, 12].forEach(function (t) { sceneHit(t, t === 0 ? 0.50 : 0.42); });
  /* bass: two notes per bar, A1 / D2 / C2 movement */
  const notes = [55.0, 55.0, 73.42, 65.41];
  for (let bar = 0; bar * 2 < duration; bar++) {
    for (let h = 0; h < 2; h++) {
      const t = bar * 2 + h;
      if (t >= duration) break;
      bass(t, notes[(bar + h) % notes.length], 0.82, 0.32);
    }
  }
  riser(12.0, 14.0);
  reverseSwell(13.9, 0.12);
  sceneHit(14.0, 0.44);
  kick(14.0, 1.0);

  return ac.startRendering().then(function (buffer) {
    const left = buffer.getChannelData(0);
    const right = buffer.getChannelData(1);
    let peak = 0;
    for (let i = 0; i < left.length; i++) {
      const l = Math.abs(left[i]);
      const r = Math.abs(right[i]);
      if (l > peak) peak = l;
      if (r > peak) peak = r;
    }
    const gain = peak > 0 ? Math.min(1.6, 0.92 / peak) : 1;
    const frames = buffer.length;
    const bytes = new ArrayBuffer(44 + frames * 4);
    const view = new DataView(bytes);
    const str = function (off, s) { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
    str(0, 'RIFF');
    view.setUint32(4, 36 + frames * 4, true);
    str(8, 'WAVE');
    str(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 2, true);
    view.setUint32(24, buffer.sampleRate, true);
    view.setUint32(28, buffer.sampleRate * 4, true);
    view.setUint16(32, 4, true);
    view.setUint16(34, 16, true);
    str(36, 'data');
    view.setUint32(40, frames * 4, true);
    let off = 44;
    for (let i = 0; i < frames; i++) {
      let l = Math.round(left[i] * gain * 32767);
      let r = Math.round(right[i] * gain * 32767);
      if (l > 32767) l = 32767;
      if (l < -32768) l = -32768;
      if (r > 32767) r = 32767;
      if (r < -32768) r = -32768;
      view.setInt16(off, l, true); off += 2;
      view.setInt16(off, r, true); off += 2;
    }
    let bin = '';
    const bytesView = new Uint8Array(bytes);
    const CHUNK = 0x8000;
    for (let i = 0; i < bytesView.length; i += CHUNK) {
      bin += String.fromCharCode.apply(null, bytesView.subarray(i, i + CHUNK));
    }
    return btoa(bin);
  });
};

/* ------------------------------------------------------------- preview */
window.play = function () {
  const t0 = performance.now();
  function loop() {
    const t = ((performance.now() - t0) / 1000) % DUR;
    window.seek(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
};
if (typeof location !== 'undefined' && location.search && location.search.indexOf('play') >= 0) {
  window.play();
}

})();
</script>
