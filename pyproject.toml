[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniframe-studio"
version = "0.1.0"
description = "Open-source, agent-first platform for code-driven, 2D cartoon and DCC-bridged video production."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OmniFrame Studio Contributors" }]
keywords = ["video", "animation", "agent", "motion-graphics", "nle", "automation", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0",
  "typer>=0.12",
  "Pillow>=10.2",
]

[project.optional-dependencies]
render = ["playwright>=1.44"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.9",
  "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/omniframe-studio/omniframe-studio"
Documentation = "https://github.com/omniframe-studio/omniframe-studio/tree/main/docs"
Issues = "https://github.com/omniframe-studio/omniframe-studio/issues"

[project.scripts]
omniframe = "omniframe.cli.main:run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omniframe = ["py.typed", "agent/schemas/*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "render: tests that require a headless browser and actually capture frames",
  "slow: tests that take more than a couple of seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
