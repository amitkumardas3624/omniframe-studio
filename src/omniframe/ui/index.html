<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniFrame Studio — Agent & Creator Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e17;
      --bg-subtle: #111827;
      --fg: #e8eaed;
      --muted: #6b7a8c;
      --accent: #00d4aa;
      --accent-dim: rgba(0, 212, 170, 0.15);
      --card: #1a2230;
      --border: #2a3a4f;
      --error: #ff4757;
      --warning: #ffa502;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      min-height: 100vh;
    }

    .app-container {
      display: grid;
      grid-template-columns: 260px 1fr;
      grid-template-rows: 64px 1fr 64px;
      gap: 0;
      height: 100vh;
    }

    /* Header */
    header {
      grid-column: 2 / 3;
      grid-row: 1 / 2;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo svg {
      width: 32px;
      height: 32px;
    }

    .title {
      font-weight: 700;
      font-size: 1.25rem;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Sidebar */
    .sidebar {
      grid-column: 1 / 2;
      grid-row: 2 / 3;
      background: var(--bg-subtle);
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }

    .sidebar-section {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-section:last-child {
      border-bottom: none;
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      color: var(--muted);
      text-decoration: none;
      border-radius: 6px;
      margin: 0.25rem 0;
      transition: background 0.15s;
    }

    .nav-link:hover {
      background: var(--card);
      color: var(--fg);
    }

    .nav-link.active {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .nav-link .icon {
      width: 18px;
      height: 18px;
    }

    /* Main content */
    .main {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
      overflow-y: auto;
      padding: 1rem;
      background: var(--bg);
    }

    .main-empty {
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* Panels */
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .panel-header {
      display: flex justify-content: space-between align-items:center;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      font-weight: 600;
      font-size: 0.875rem;
    }

    .panel-close {
      opacity: 0;
      transition: opacity 0.15s;
    }

    .panel:hover .panel-close {
      opacity: 1;
    }

    /* Tables */
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table th {
      padding: 0.5rem 0.25rem;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .data-table td {
      padding: 0.5rem 0.25rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .data-table tr:hover td {
      background: var(--accent-dim);
    }

    /* Status badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem 0.5rem;
      border-radius: 10px;
      font-size: 0.65rem;
      font-weight: 500;
    }

    .badge-healthy { background: var(--accent-dim); color: var(--accent); }
    .badge-warning { background: rgba(255, 165, 2, 0.15); color: var(--warning); }
    .badge-critical { background: rgba(255, 71, 87, 0.15); color: var(--error); }

    /* Animations */
    .fade-in {
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0s !important;
        transition-duration: 0s !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8" cy="8" r="2"/>
          <circle cx="16" cy="16" r="2"/>
          <line x1="9" y1="9" x2="9.01" y2="9.01"/>
        </svg>
        <span class="title">OmniFrame Studio</span>
      </div>
      <div class="status-indicator">
        <div class="status-dot" id="status-dot"></div>
        <span class="text-sm text-muted" id="status-text">Initializing...</span>
      </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <div class="section-title">Navigation</div>
        <nav>
          <a href="#" class="nav-link active" data-panel="dashboard">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="current" stroke-width="1.5">
              <path d="M3 12l8.5-8.5a1 1 0 0 1 1.41 0l-7 7a1 1 0 0 1-1.41-1.41z"/>
              <path d="M12 3v8l4 4"/>
            </svg>
            Dashboard
          </a>

          <a href="#" class="nav-link" data-panel="projects">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="current" stroke-width="1.5">
              <path d="M3 12l8.5-8.5a1 1 0 0 1 1.41 0l-7 7a1 1 0 0 1-1.41-1.41z"/>
              <path d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v4"/>
            </svg>
            Projects
          </a>

          <a href="#" class="nav-link" data-panel="render">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="current" stroke-width="1.5">
              <circle cx="12" cy="12" r="3"/>
              <path d="M2 12l20"/>
              <path d="M2 12l6.86-6.86"/>
            </svg>
            Render
          </a>

          <a href="#" class="nav-link" data-panel="bridges">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="current" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8" cy="8" r="2"/>
              <circle cx="16" cy="16" r="2"/>
            </svg>
            Bridges
          </a>

          <a href="#" class="nav-link" data-panel="inspection">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="current" stroke-width="1.5">
              <polyline points="4 7 4 4 20 4 20 7"/>
              <line x1="9" y1="20" x2="15" y2="20"/>
              <line x1="12" y1="4" x2="12" y2="14"/>
            </svg>
            Inspection
          </a>
        </nav>
      </div>

      <div class="sidebar-section">
        <div class="section-title">Tools</div>
        <nav id="tools-nav">
          <!-- Populated by API -->
        </nav>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main" id="main">
      <div class="main-empty" id="main-empty">
        <span>Select a panel from the sidebar</span>
      </div>
    </main>

    <!-- Panels (floating above main) -->
    <div class="panel" id="dashboard-panel" style="position: fixed; right: 0; top: 64px; width: 400px; height: calc(100vh - 128px); overflow-y: auto;">
      <div class="panel-header">
        <span class="panel-title">Dashboard</span>
        <button class="panel-close" aria-label="Close panel">&times;</button>
      </div>
      <div id="dashboard-content">
        <div style="color: var(--muted); font-size: 0.9rem;">
          <div>OmniFrame Studio Dashboard</div>
          <div class="mt-2" id="doctor-status">Running doctor...</div>
          <button class="btn btn-acent mt-2" onclick="runDoctor()">Run Doctor</button>
        </div>
      </div>
    </div>

    <div class="panel" id="projects-panel" style="position: fixed; right: 0; top: 64px; width: 400px; height: calc(100vh - 128px); overflow-y: auto; display: none;">
      <div class="panel-header">
        <span class="panel-title">Projects</span>
        <button class="panel-close" aria-label="Close panel">&times;</button>
      </div>
      <div id="projects-content">
        <div class="main-empty" style="min-height: 200px;">Project list will appear here</div>
      </div>
    </div>

    <div class="panel" id="render-panel" style="position: fixed; right: 0; top: 64px; width: 400px; height: calc(100vh - 128px); overflow-y: auto; display: none;">
      <div class="panel-header">
        <span class="panel-title">Render Control</span>
        <button class="panel-close" aria-label="Close panel">&times;</button>
      </div>
      <div id="render-content">
        <div class="mb-2">
          <label class="text-sm text-muted block mb-1">Project file</label>
          <input type="file" id="project-file" accept=".json,.jsonl" class="block w-full rounded border px-2 py-1 text-sm">
          <button class="btn btn-primary mt-2" id="render-btn">Render to MP4</button>
        </div>
        <div class="mt-4 text-sm text-muted" id="render-status">Ready</div>
      </div>
    </div>

    <div class="panel" id="bridges-panel" style="position: fixed; right: 0; top: 64px; width: 400px; height: calc(100vh - 128px); overflow-y: auto; display: none;">
      <div class="panel-header">
        <span class="panel-title">DCC Bridges</span>
        <button class="panel-close" aria-label="Close panel">&times;</button>
      </div>
      <div id="bridges-content">
        <div class="mb-2">
          <button class="btn btn-ghost w-full mb-2" onclick="refreshBridges()">Refresh Status</button>
        </div>
        <div id="bridges-list" class="data-table">
          <thead>
            <tr>
              <th>Bridge</th>
              <th>Status</th>
              <th>Executable</th>
            </tr>
          </thead>
          <tbody>
            <!-- Populated by API -->
          </tbody>
        </div>
      </div>
    </div>

    <div class="panel" id="inspection-panel" style="position: fixed; right: 0; top: 64px; width: 400px; height: calc(100vh - 128px); overflow-y: auto; display: none;">
      <div class="panel-header">
        <span class="panel-title">Inspection</span>
        <button class="panel-close" aria-label="Close panel">&times;</button>
      </div>
      <div id="inspection-content">
        <div class="mb-2">
          <label class="text-sm text-muted block mb-1">Video file</label>
          <input type="file" id="inspect-video" accept="video/*" class="block w-full rounded border px-2 py-1 text-sm">
          <button class="btn btn-primary mt-2" onclick="runInspection()">Build Contact Sheet</button>
        </div>
        <div class="mt-4 text-sm text-muted" id="inspect-status">Ready</div>
        <div id="contact-sheet" class="mt-4 hidden"></div>
      </div>
    </div>
  </div>

  <script>
    // Initialize UI
    document.addEventListener('DOMContentLoaded', () => {
      // Connect to WebSocket for agent activity
      const ws = new WebSocket('ws://localhost:8765/ws/agent-activity');
      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');

      ws.onopen = () => {
        statusDot.style.background = 'var(--accent)';
        statusText.textContent = 'Connected';
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        // Handle agent activity messages
        if (data.type === 'doctor') {
          updateDoctorStatus(data.status);
        }
      };

      ws.onclose = () => {
        statusDot.style.background = '#ff4757';
        statusText.textContent = 'Disconnected';
      };
    });

    // Update doctor status
    function updateDoctorStatus(status) {
      const statusEl = document.getElementById('doctor-status');
      if (status.all_good) {
        statusEl.innerHTML = '<span class="badge badge-healthy">All systems operational</span>';
      } else {
        statusEl.innerHTML = '<span class="badge badge-critical">Issues detected</span>';
      }
    }

    // Run doctor
    async function runDoctor() {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = 'Running...';
      
      try {
        const resp = await fetch('/api/v1/environment', {method: 'POST'});
        const data = await resp.json();
        updateDoctorStatus(data);
      } catch (e) {
        console.error('Doctor failed:', e);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Run Doctor';
      }
    }

    // Refresh bridges
    async function refreshBridges() {
      try {
        const resp = await fetch('/api/v1/bridges', {method: 'POST'});
        const data = await resp.json();
        renderBridges(data.result || []);
      } catch (e) {
        console.error('Bridges fetch failed:', e);
      }
    }

    function renderBridges(bridges) {
      const tbody = document.querySelector('#bridges-list tbody');
      if (!bridges || bridges.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="text-muted">No bridges configured</td></tr>';
        return;
      }
      
      let html = '';
      bridges.forEach(b => {
        const statusClass = b.available ? 'badge-healthy' : 'badge-critical';
        const statusText = b.available ? 'Available' : 'Not Found';
        html += `<tr>
          <td>${b.bridge_name}</td>
          <td><span class="badge ${statusClass}">${statusText}</span></td>
          <td>${b.executable_path || 'N/A'}</td>
        </tr>`;
      });
      tbody.innerHTML = html;
    }

    // Initialize: check which panel to show
    const hash = window.location.hash;
    if (hash === '#bridges') showPanel('bridges-panel');
    else if (hash === '#render') showPanel('render-panel');
    else showPanel('dashboard-panel'); // default
    
    function showPanel(panelId) {
      // Hide all panels
      document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
      // Show selected
      const panel = document.getElementById(panelId);
      if (panel) panel.style.display = 'block';
      // Update nav links
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('active', link.dataset.panel === panelId.replace('-panel', ''));
      });
    }
  </script>
</body>
</html>
